logging.level.org.springframework.web=ERROR
management.endpoints.web.exposure.include=*

spring.application.name=mm-factory-portal
spring.threads.virtual.enabled=true

spring.datasource.url=jdbc:postgresql://localhost:5432/mm_factory_portal
spring.datasource.username=mmfactory
spring.datasource.password=mmfactory

# spring.profiles.active=dev

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=mmf_portal

spring.flyway.enabled=true
spring.flyway.schemas=mmf_portal
spring.flyway.default-schema=mmf_portal
spring.flyway.baseline-on-migrate=true

# Observability
# For development keep 1.0 for all traces to export, production environment keep 0.1
#management.tracing.sampling.probability=1.0
#management.otlp.metrics.export.url=http://localhost:4318/v1/metrics
#management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
#management.opentelemetry.logging.export.otlp.endpoint=http://localhost:4318/v1/logs

# Turn off automatic schema generation
spring.modulith.events.jdbc.schema-initialization.enabled=false
